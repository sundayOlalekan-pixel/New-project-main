
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>People Counter | TS Academy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="counter-card">
<h2>TESTING ....</h2>
        <div class="logo">
            TS <span>ACADEMY</span>
        </div>

        <p class="subtitle">JavaScript Beginner Project</p>

        <h1>People Counter</h1>

        <p class="description">
            Count the number of people entering a location.
        </p>

        <div class="counter-display">
            <span id="count-people">0</span>
        </div>

        <div class="buttons">
            <button id="increment-btn" onclick="increment()">
                + INCREMENT
            </button>

            <button id="save-btn" onclick="save()">
                SAVE ENTRY
            </button>
        </div>

        <div class="entries-box">
            <h2>Previous Entries</h2>

            <p id="save-el">No entries saved yet.</p>
        </div>

        <button class="reset-btn" onclick="resetCounter()">
            Reset Counter
        </button>

        <footer>
            Built for learning JavaScript with
            <strong>TS Academy</strong>
        </footer>

    </main>

    <script src="main.js">hi</script>

</body>
</html>
